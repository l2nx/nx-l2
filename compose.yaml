name: l2nx

services:
  db:
    image: postgres:18.6
    container_name: l2nx-db
    environment:
      POSTGRES_DB: l2nx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "l2nx"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - l2nx-db-data:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/nx-l2.sql:ro

volumes:
  l2nx-db-data:
    name: l2nx-db-pg-data
