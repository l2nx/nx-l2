name: l2nx

services:
  db:
    image: mariadb:11.8
    container_name: l2nx-db
    environment:
      MARIADB_DATABASE: l2nx
      MARIADB_USER: l2nx
      MARIADB_PASSWORD: l2nx
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - l2nx-db-data:/var/lib/mysql
      - ./docker/mariadb-init.sh:/docker-entrypoint-initdb.d/nx-l2.sh:ro
      - ./login/server/sql:/sql/login:ro
      - ./chronicles/high-five/datapack/sql:/sql/game:ro

volumes:
  l2nx-db-data:
    name: l2nx-db-data
