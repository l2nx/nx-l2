name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, nexus]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14

  licenses:
    runs-on: [self-hosted, linux, nexus]
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6
      - run: sh .github/scripts/gpl-report.sh
