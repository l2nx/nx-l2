# ---------------------------------------------------------------------------
# Underground Coliseum
# ---------------------------------------------------------------------------

# Battle period start time, as an RFC 5545 recurrence rule in the server time zone.
# Set BYMINUTE, and BYHOUR for daily or longer rules; COUNT and INTERVAL are not supported (the rule has no fixed start date).
# Set the day as well: BYDAY for weekly rules, BYMONTHDAY or BYDAY for monthly, BYYEARDAY, BYDAY or BYMONTH with BYMONTHDAY for yearly.
# Default is 9:00 PM every Friday, Saturday, and Sunday.
BattleStartRrule = FREQ=WEEKLY;BYDAY=FR,SA,SU;BYHOUR=21;BYMINUTE=0

# Battle period (in hours)
# Default: 2
BattlePeriod = 2

# Announce on event start and finish.
# Default: False
AllowAnnouncements = False

# Minimum party member size that can register.
# Default: 7
PartySize = 7

# Resurrection delay (in seconds).
# Default: 10
ResurrectionTime = 10
