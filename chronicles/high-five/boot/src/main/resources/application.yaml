spring:
  application:
    name: game-server
  datasource:
    username: l2nx_game
    hikari:
      maximum-pool-size: 20
  grpc:
    client:
      channel:
        login:
          # A target other than loopback needs spring.grpc.client.channel.login.ssl.bundle: the secret travels in it.
          target: static://127.0.0.1:9014
          keepalive:
            time: 15s
            timeout: 10s
  # Background tasks: work with no game state. Platform threads, not spring.threads.virtual.enabled: Boot then builds a
  # scheduler whose periodic runs may overlap.
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: l2nx-background-
    execution:
      thread-name-prefix: l2nx-background-exec-

server:
  port: 8777

l2nx:
  database:
    schema: game
