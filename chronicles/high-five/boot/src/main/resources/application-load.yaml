spring:
  datasource:
    # The published port of load-db, for a server started on the host; the compose service sets its own address.
    url: jdbc:postgresql://localhost:5433/l2nx_load

l2nx:
  network:
    connections-per-ip: 10000
    accept-per-ip-per-second: 10000

management:
  metrics:
    distribution:
      percentiles-histogram:
        l2nx.session.input: true
      slo:
        # The longest name prefix wins: without its own empty entry the phases would take the pass bounds.
        l2nx.engine.pass.phase: []
