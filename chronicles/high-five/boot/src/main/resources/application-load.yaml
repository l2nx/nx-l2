spring:
  datasource:
    # The published port of load-db, for a server started on the host; the compose service sets its own address.
    url: jdbc:postgresql://localhost:5433/l2nx_load

l2nx:
  network:
    connections-per-ip: 10000
    accept-per-ip-per-second: 10000
