spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/l2nx
    password: l2nx
    hikari:
      pool-name: l2nx-db
      schema: ${l2nx.database.schema}
      data-source-properties:
        # A connection left inside a transaction would hold its locks until the pool closed it.
        options: -c idle_in_transaction_session_timeout=60s
  liquibase:
    change-log: classpath:db/liquibase-changelog.yaml
    default-schema: ${l2nx.database.schema}
    liquibase-schema: ${l2nx.database.schema}

server:
  address: 127.0.0.1

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health, info, prometheus, loggers, threaddump
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState, db
    info:
      access: read-only
    prometheus:
      access: read-only
    loggers:
      access: unrestricted
    threaddump:
      access: read-only
  info:
    java:
      enabled: true
    os:
      enabled: true
    process:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        jvm.gc.pause: true
        hikaricp.connections.acquire: true
