spring:
  datasource:
    url: jdbc:mysql://localhost:3306/l2nx?allowPublicKeyRetrieval=true&useSSL=false
    username: l2nx
    password: l2nx
    hikari:
      pool-name: l2nx-db

server:
  address: 127.0.0.1

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health, info, prometheus, loggers, threaddump
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState, db
    info:
      access: read-only
    prometheus:
      access: read-only
    loggers:
      access: unrestricted
    threaddump:
      access: read-only
  info:
    java:
      enabled: true
    os:
      enabled: true
    process:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        jvm.gc.pause: true
        hikaricp.connections.acquire: true
