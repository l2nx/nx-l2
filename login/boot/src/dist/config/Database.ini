# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------

# Specify the JDBC driver class for your database.
# Default: com.mysql.cj.jdbc.Driver
Driver = com.mysql.cj.jdbc.Driver

# Database URL
# Default: jdbc:mysql://localhost/l2nx?useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=10000&interactiveClient=true&sessionVariables=wait_timeout=600,interactive_timeout=600&autoReconnect=true
URL = jdbc:mysql://localhost/l2nx?useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=10000&interactiveClient=true&sessionVariables=wait_timeout=600,interactive_timeout=600&autoReconnect=true

# Database user. The local database from compose.yaml creates l2nx / l2nx.
Login = l2nx
Password = l2nx

# Maximum number of database connections to maintain in the pool.
# Default: 5
MaximumDatabaseConnections = 5

# Determine whether database connections should be tested for availability.
# Default: False
TestDatabaseConnections = False

