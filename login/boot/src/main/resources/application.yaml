spring:
  application:
    name: login-server
  datasource:
    username: l2nx_login
    hikari:
      maximum-pool-size: 5

server:
  port: 8106

l2nx:
  database:
    schema: login
  login:
    client:
      host: 0.0.0.0
      ports:
        - port: 2106
          variant: c621
    game-server:
      host: 127.0.0.1
      port: 9014
      accept-new: true
    ban:
      failed-logins: 5
      # A number without a unit is seconds.
      duration: 15m
    flood-protection:
      enabled: true
      fast-connection-limit: 15
      normal-connection-time: 700ms
      fast-connection-time: 350ms
      max-connections-per-ip: 50
    scheduled-restart:
      enabled: false
      # A number without a unit is hours.
      delay: 24h
    show-licence: true
    auto-create-accounts: true
    datapack-root: .
