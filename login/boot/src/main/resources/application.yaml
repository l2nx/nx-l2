spring:
  application:
    name: login-server
  datasource:
    username: l2nx_login
    hikari:
      maximum-pool-size: 5
  grpc:
    server:
      # Without TLS the GS-link secret travels in clear, so any other address needs spring.grpc.server.ssl.bundle.
      address: 127.0.0.1
      port: 9014
      keepalive:
        time: 15s
        timeout: 10s
        permit:
          # Below the game server's keepalive time, or the server would answer its pings with GOAWAY.
          time: 10s
      reflection:
        enabled: false
      shutdown:
        grace-period: 15s

server:
  port: 8106

l2nx:
  database:
    schema: login
  login:
    client:
      host: 0.0.0.0
      ports:
        - port: 2106
          variant: c621
    game-server:
      accept-new: true
    ban:
      # Failed logins from one address that ban it, counted until failed-logins-window passes without a failure.
      failed-logins: 5
      # A number without a unit is seconds.
      failed-logins-window: 15m
      duration: 15m
    scheduled-restart:
      enabled: false
      # A number without a unit is hours.
      delay: 24h
    show-licence: true
    auto-create-accounts: true
    datapack-root: .
