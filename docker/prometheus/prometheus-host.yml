# Servers started on the host (bootRun or the distribution): L2NX_PROMETHEUS_CONFIG=prometheus-host.yml.
# Job names equal l2nx.load.prometheus.targets[].job of the load harness.
global:
  scrape_interval: 1s
  scrape_timeout: 1s

scrape_configs:
  - job_name: game
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8777"]
  - job_name: login
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8106"]
