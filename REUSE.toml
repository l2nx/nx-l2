version = 1

[[annotations]]
path = ["docs/**", "README.md", "CLAUDE.md", "CONTRIBUTING.md", "LEGAL.md", ".gitignore", ".gitattributes", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 L2NX contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  "chronicles/high-five/datapack/**",
  "chronicles/high-five/boot/src/dist/**",
  "login/boot/src/dist/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "L2J Mobius contributors"
SPDX-License-Identifier = "MIT"

# A formatted SQL changelog must open with its Liquibase header and allows no comment outside a changeset.
[[annotations]]
path = [
  "chronicles/high-five/server/src/main/resources/db/liquibase/000-baseline.sql",
  "login/server/src/main/resources/db/liquibase/000-baseline.sql",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 L2NX contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["NOTICE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 L2NX contributors"
SPDX-License-Identifier = "Apache-2.0"


[[annotations]]
path = ["gradle/wrapper/**", "gradlew", "gradlew.bat"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Gradle contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["**/*.gradle.kts", "gradle.properties", "gradle/libs.versions.toml", "lombok.config", "build-logic/**", "renovate.json", "compose.yaml", "docker/**", ".github/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 L2NX contributors"
SPDX-License-Identifier = "Apache-2.0"
