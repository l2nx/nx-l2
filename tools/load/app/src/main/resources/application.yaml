spring:
  application:
    name: load
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 10s
  main:
    web-application-type: none
    banner-mode: off
  autoconfigure:
    exclude:
      # It builds a server's event loops; load bots run on the harness's own group.
      - app.l2nx.network.NetworkAutoConfiguration
      # The database commands open plain JDBC connections and want no pool; the starter arrives with the test fixtures.
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

l2nx:
  load:
    bots: 100
    ramp: 30s
    warm-up: 30s
    steady: 2m
    ramp-down: 10s
    seed: 1
    intent-timeout: 5s
    # Above the slowest healthy step under load: a load bot over it stops on an error.
    lifecycle-timeout: 30s
    max-generator-lag-p99: 10ms
    output-dir: build/load
    accounts:
      prefix: load
      password: load
    login-storm:
      final-state: IN_GAME
    in-memory:
      step-delay: 10ms
      ack-latency: 5ms
    p267:
      login-host: 127.0.0.1
      login-port: 2106
      server-id: 1
      connect-timeout: 5s
    # As the host reaches them, for a harness and servers started there; the harness service of compose.yaml replaces
    # the addresses with its service names. Jobs as in docker/prometheus/prometheus.yml.
    prometheus:
      url: http://127.0.0.1:9090
      # One 1 s scrape: a smaller skew moves each window edge by at most one scrape, the resolution the window has anyway.
      max-clock-skew: 1s
      targets:
        - job: game
          metrics-url: http://127.0.0.1:8777/actuator/prometheus
        - job: login
          metrics-url: http://127.0.0.1:8106/actuator/prometheus
    # The published port of load-db in compose.yaml; the server roles come from docker/postgres-init.sql.
    database:
      admin-url: jdbc:postgresql://localhost:5433/postgres
      user: postgres
      password: postgres
      name: l2nx_load
      template: l2nx_load_template
      schemas:
        - name: login
          owner: l2nx_login
        - name: game
          owner: l2nx_game
